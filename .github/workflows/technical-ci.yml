name: Technical CI

on:
  push:
    branches:
      - 'task/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit Tests
        run: npx tsx --test tests/publishing-revisions-admin-cutover.test.ts
      - name: Build
        run: npm run build

  postgres_integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?schema=public
        run: npx prisma migrate deploy
      - name: Run PostgreSQL Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?schema=public
        run: npx tsx --test tests/publishing-revisions-postgres.test.ts
