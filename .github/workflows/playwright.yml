name: Playwright CI

on:
  push:
    branches:
      - 'task/**'
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies
        run: npm ci
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 ${{ job.services.postgres.ports[5432] }}; then
              echo "Postgres port is reachable!"
              break
            fi
            echo "Waiting for postgres..."
            sleep 1
          done
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Prisma Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?schema=public
        run: npx prisma migrate deploy
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright Browser Smoke Suite
        env:
          DATABASE_URL: postgresql://postgres:postgres_password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?schema=public
        run: npm run test:e2e
