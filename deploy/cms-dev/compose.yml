services:
  cms:
    container_name: synthesis_cms_dev_app

    image: "synthesis-cms-dev:${CMS_GIT_SHA:?CMS_GIT_SHA required}"

    build:
      context: ../..
      dockerfile: deploy/cms-dev/Dockerfile

    restart: unless-stopped
    init: true

    depends_on:
      cms-db:
        condition: service_healthy
      cms-storage:
        condition: service_healthy
      cms-migration:
        condition: service_completed_successfully
      cms-storage-init:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CMS_GIT_SHA: "${CMS_GIT_SHA}"
      DATABASE_URL: "${DATABASE_URL}"
      CMS_STORAGE_ENDPOINT: "http://cms-storage:3900"
      CMS_STORAGE_BUCKET: "synthesis-cms-dev"
      CMS_STORAGE_ACCESS_KEY: "${CMS_STORAGE_ACCESS_KEY}"
      CMS_STORAGE_SECRET_KEY: "${CMS_STORAGE_SECRET_KEY}"
      CMS_STORAGE_REGION: "us-east-1"

    expose:
      - "3000"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - internal
      - edge

  cms-db:
    container_name: synthesis_cms_dev_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synthesis_cms_dev
      POSTGRES_USER: synthesis_cms_dev_user
      POSTGRES_PASSWORD: "${CMS_DB_PASSWORD:?CMS_DB_PASSWORD required}"
    volumes:
      - cms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthesis_cms_dev_user -d synthesis_cms_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cms-storage:
    container_name: synthesis_cms_dev_storage
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required}"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - cms-storage-meta:/var/lib/garage/meta
      - cms-storage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cms-migration:
    container_name: synthesis_cms_dev_migration
    image: "synthesis-cms-dev:${CMS_GIT_SHA:?CMS_GIT_SHA required}"
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      cms-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL required}"
    networks:
      - internal

  cms-storage-init:
    container_name: synthesis_cms_dev_storage_init
    build:
      context: .
      dockerfile: Dockerfile.garage-init
    restart: "no"
    depends_on:
      cms-storage:
        condition: service_healthy
    network_mode: "service:cms-storage"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - cms-storage-meta:/var/lib/garage/meta:ro
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_RPC_SECRET: "${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET required}"
      CMS_STORAGE_ACCESS_KEY: "${CMS_STORAGE_ACCESS_KEY:?CMS_STORAGE_ACCESS_KEY required}"
      CMS_STORAGE_SECRET_KEY: "${CMS_STORAGE_SECRET_KEY:?CMS_STORAGE_SECRET_KEY required}"
    entrypoint: >
      /bin/sh -c '
      set -eu;
      case "$$CMS_STORAGE_ACCESS_KEY" in
        GK*) ;;
        *) echo "SECURITY ERROR: CMS_STORAGE_ACCESS_KEY must start with GK" >&2; exit 1 ;;
      esac;
      echo "Waiting for Garage daemon to be ready...";
      for i in $$(seq 1 30); do
        if /garage status >/dev/null 2>&1; then
          break;
        fi;
        if [ "$$i" -eq 30 ]; then
          echo "FAIL: Timed out waiting for Garage daemon" >&2;
          exit 1;
        fi;
        sleep 1;
      done;
      NODE_ID="$$(\
        /garage node id -q 2>/dev/null || \
        /garage status 2>/dev/null | awk "/^[0-9a-f]{16,}/ {print \$$1; exit}" || \
        /garage status 2>/dev/null | grep -E -o "^[0-9a-f]{16,}" | head -n1\
      )";
      if [ -z "$$NODE_ID" ]; then
        echo "FAIL: Could not identify Garage node ID" >&2;
        exit 1;
      fi;
      echo "Identified Garage node ID: $$NODE_ID";
      NODE_SHORT="$$(echo "$$NODE_ID" | cut -c 1-16)";
      STATUS_OUTPUT="$$(\
        /garage status 2>&1\
      )";
      if echo "$$STATUS_OUTPUT" | grep -qi "NO ROLE ASSIGNED"; then
        echo "Assigning single-node layout for node $$NODE_ID...";
        /garage layout assign -z dc1 -c 100G "$$NODE_ID";
        /garage layout apply --version 1;
      else
        LAYOUT_OUTPUT="$$(/garage layout show)";
        if printf "%s\n" "$$LAYOUT_OUTPUT" | grep -Eq "^$${NODE_SHORT}[[:space:]]"; then
          echo "Single-node layout already assigned.";
        else
          echo "FAIL: Node role exists but node $$NODE_SHORT not found in active layout" >&2;
          exit 1;
        fi;
      fi;
      if ! /garage bucket info synthesis-cms-dev >/dev/null 2>&1; then
        echo "Creating bucket synthesis-cms-dev...";
        /garage bucket create synthesis-cms-dev;
      else
        echo "Bucket synthesis-cms-dev already exists.";
      fi;
      if ! /garage key info "$$CMS_STORAGE_ACCESS_KEY" >/dev/null 2>&1; then
        echo "Importing app storage credentials...";
        /garage key import "$$CMS_STORAGE_ACCESS_KEY" "$$CMS_STORAGE_SECRET_KEY" -n cms-app-key --yes;
      else
        echo "Storage key $$CMS_STORAGE_ACCESS_KEY already imported.";
      fi;
      echo "Configuring permissions on synthesis-cms-dev...";
      /garage bucket allow --read --write synthesis-cms-dev --key "$$CMS_STORAGE_ACCESS_KEY";
      echo "Verifying bootstrap...";
      /garage bucket info synthesis-cms-dev;
      KEY_INFO="$$(\
        /garage key info "$$CMS_STORAGE_ACCESS_KEY"\
      )";
      echo "$$KEY_INFO";
      case "$$KEY_INFO" in
        *admin*|*all_buckets*) echo "SECURITY VIOLATION: Excessive permissions detected on app key!" >&2; exit 1 ;;
        *) echo "Least-privilege boundary verified: read/write to synthesis-cms-dev only." ;;
      esac;
      echo "Garage storage bootstrap completed successfully."
      '

networks:
  internal:
    name: synthesis_cms_dev_internal

  edge:
    external: true
    name: "${CMS_EDGE_NETWORK:?CMS_EDGE_NETWORK required}"

volumes:
  cms-db-data:
    name: synthesis_cms_dev_db_data
  cms-storage-meta:
    name: synthesis_cms_dev_storage_meta
  cms-storage-data:
    name: synthesis_cms_dev_storage_data
