services:
  cms:
    container_name: synthesis_cms_dev_app

    image: "synthesis-cms-dev:${CMS_GIT_SHA:?CMS_GIT_SHA required}"

    build:
      context: ../..
      dockerfile: deploy/cms-dev/Dockerfile

    restart: unless-stopped
    init: true

    depends_on:
      cms-db:
        condition: service_healthy
      cms-storage:
        condition: service_healthy
      cms-migration:
        condition: service_completed_successfully
      cms-storage-init:
        condition: service_completed_successfully

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      CMS_GIT_SHA: "${CMS_GIT_SHA}"
      DATABASE_URL: "${DATABASE_URL}"
      CMS_STORAGE_ENDPOINT: "http://cms-storage:9000"
      CMS_STORAGE_BUCKET: "synthesis-cms-dev"
      CMS_STORAGE_ACCESS_KEY: "${CMS_STORAGE_ACCESS_KEY}"
      CMS_STORAGE_SECRET_KEY: "${CMS_STORAGE_SECRET_KEY}"
      CMS_STORAGE_REGION: "us-east-1"

    expose:
      - "3000"

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/admin/svg-editor').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - internal
      - edge

  cms-db:
    container_name: synthesis_cms_dev_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: synthesis_cms_dev
      POSTGRES_USER: synthesis_cms_dev_user
      POSTGRES_PASSWORD: "${CMS_DB_PASSWORD:?CMS_DB_PASSWORD required}"
    volumes:
      - cms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthesis_cms_dev_user -d synthesis_cms_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cms-storage:
    container_name: synthesis_cms_dev_storage
    image: minio/minio:RELEASE.2024-01-28T22-44-53Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: synthesis_cms_dev_admin
      MINIO_ROOT_PASSWORD: "${CMS_STORAGE_ADMIN_PASSWORD:?CMS_STORAGE_ADMIN_PASSWORD required}"
    volumes:
      - cms-storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  cms-migration:
    container_name: synthesis_cms_dev_migration
    image: "synthesis-cms-dev:${CMS_GIT_SHA:?CMS_GIT_SHA required}"
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      cms-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL required}"
    networks:
      - internal

  cms-storage-init:
    container_name: synthesis_cms_dev_storage_init
    image: minio/mc:RELEASE.2024-01-28T16-08-53Z
    restart: "no"
    depends_on:
      cms-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -eu;
      /usr/bin/mc alias set local http://cms-storage:9000 synthesis_cms_dev_admin \"$${CMS_STORAGE_ADMIN_PASSWORD}\";
      /usr/bin/mc mb --ignore-existing local/synthesis-cms-dev;
      /usr/bin/mc anonymous set none local/synthesis-cms-dev;
      if ! /usr/bin/mc admin user info local \"$${CMS_STORAGE_ACCESS_KEY}\" >/dev/null 2>&1; then
        /usr/bin/mc admin user add local \"$${CMS_STORAGE_ACCESS_KEY}\" \"$${CMS_STORAGE_SECRET_KEY}\";
      else
        /usr/bin/mc admin user enable local \"$${CMS_STORAGE_ACCESS_KEY}\";
      fi;
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetBucketLocation\",\"s3:ListBucket\",\"s3:ListBucketMultipartUploads\"],\"Resource\":[\"arn:aws:s3:::synthesis-cms-dev\"]},{\"Effect\":\"Allow\",\"Action\":[\"s3:AbortMultipartUpload\",\"s3:DeleteObject\",\"s3:GetObject\",\"s3:ListMultipartUploadParts\",\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::synthesis-cms-dev/*\"]}]}' > /tmp/cms-app-policy.json;
      /usr/bin/mc admin policy create local synthesis_cms_dev_app_policy /tmp/cms-app-policy.json;
      /usr/bin/mc admin policy attach local synthesis_cms_dev_app_policy --user \"$${CMS_STORAGE_ACCESS_KEY}\";
      /usr/bin/mc stat local/synthesis-cms-dev;
      ANON_POLICY=\"$$(/usr/bin/mc anonymous get local/synthesis-cms-dev)\";
      case \"$${ANON_POLICY}\" in
        *none*) echo 'Bucket privacy verified: anonymous access is none.' ;;
        *) echo 'SECURITY VIOLATION: Bucket is not private!' >&2; exit 1 ;;
      esac;
      /usr/bin/mc admin policy info local synthesis_cms_dev_app_policy;
      USER_INFO=\"$$(/usr/bin/mc admin user info local \"$${CMS_STORAGE_ACCESS_KEY}\")\";
      case \"$${USER_INFO}\" in
        *synthesis_cms_dev_app_policy*) echo 'Policy attachment verified: synthesis_cms_dev_app_policy is attached.' ;;
        *) echo 'SECURITY VIOLATION: synthesis_cms_dev_app_policy not attached to user!' >&2; exit 1 ;;
      esac;
      case \"$${USER_INFO}\" in
        *readwrite*|*consoleAdmin*) echo 'SECURITY VIOLATION: Excessive generic policy attached to app user!' >&2; exit 1 ;;
        *) echo 'User privilege boundary verified: no excessive permissions.' ;;
      esac;
      echo 'cms-storage-init completed successfully.'
      "
    environment:
      CMS_STORAGE_ADMIN_PASSWORD: "${CMS_STORAGE_ADMIN_PASSWORD:?CMS_STORAGE_ADMIN_PASSWORD required}"
      CMS_STORAGE_ACCESS_KEY: "${CMS_STORAGE_ACCESS_KEY:?CMS_STORAGE_ACCESS_KEY required}"
      CMS_STORAGE_SECRET_KEY: "${CMS_STORAGE_SECRET_KEY:?CMS_STORAGE_SECRET_KEY required}"
    networks:
      - internal

networks:
  internal:
    name: synthesis_cms_dev_internal

  edge:
    external: true
    name: "${CMS_EDGE_NETWORK:?CMS_EDGE_NETWORK required}"

volumes:
  cms-db-data:
    name: synthesis_cms_dev_db_data
  cms-storage-data:
    name: synthesis_cms_dev_storage_data
